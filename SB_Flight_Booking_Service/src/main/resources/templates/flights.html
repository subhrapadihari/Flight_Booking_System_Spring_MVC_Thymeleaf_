<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Flight Management</title>
</head>

<body>

<h1>Flight Management</h1>

<a th:href="@{/flights/add}">Add New Flight</a>

<br><br>

<table border="1" cellpadding="10">

    <tr>
        <th>ID</th>
        <th>Flight Number</th>
        <th>Airline</th>
        <th>Source</th>
        <th>Destination</th>
        <th>Departure Time</th>
        <th>Arrival Time</th>
        <th>Total Seats</th>
        <th>Available Seats</th>
        <th>Price</th>
        <th>Action</th>
    </tr>

    <tr th:each="flight : ${flights}">

        <td th:text="${flight.id}"></td>
        <td th:text="${flight.flightNumber}"></td>
        <td th:text="${flight.airline}"></td>
        <td th:text="${flight.source}"></td>
        <td th:text="${flight.destination}"></td>
        <td th:text="${flight.departureTime}"></td>
        <td th:text="${flight.arrivalTime}"></td>
        <td th:text="${flight.totalSeats}"></td>
        <td th:text="${flight.availableSeats}"></td>
        <td th:text="${flight.price}"></td>

        <td>
            <a th:href="@{/flights/edit/{id}(id=${flight.id})}">
                Edit
            </a>

            |

            <a th:href="@{/flights/delete/{id}(id=${flight.id})}">
                Delete
            </a>
        </td>

    </tr>

</table>

<br>

<a th:href="@{/passengers}">
    Passenger Management
</a>

<br><br>

<a th:href="@{/bookings}">
    Booking Management
</a>

</body>
</html>
